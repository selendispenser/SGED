<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selen 길드 관리 도구</title>
    <script 
        src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js" 
        integrity="sha384-l+xbElFSnPZ2rOaPrU//2FF5B4LB8FiX5q4fXYTlfcG4PGpMkE1vcL7kNXI6Cci0" 
        crossorigin="anonymous">
    </script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" href="assets/Selen.png" type="image/x-icon">
</head>
<body>

    <div id="app">
        <header>
            <h1>Selen 수로 참여 체크</h1>
            <p id="counter" aria-live="polite" aria-atomic="true">선택된 인원: 0명</p>
            <p id="date">2026.04.19 기준</p>
        </header>

        <section class="controls" aria-label="명단 조작">
            <div class="add-container">
                <label for="memberInput" class="visually-hidden">추가할 길드원 이름</label>
                <input type="text" id="memberInput" class="search-input" placeholder="추가할 길드원 이름 입력...">
                <button type="button" id="btnAddMember" class="add-btn">추가</button>
            </div>
            <div class="filter-buttons">
                <button type="button" id="btnLoadSoldiers" class="secondary-btn">명단 최신화</button>
                <button type="button" id="btnSelectAll" class="secondary-btn">전체 선택</button>
                <button type="button" id="btnReset" class="secondary-btn">전체 해제</button>
            </div>
            <details class="paste-container">
                <summary>명단 붙여넣기로 체크</summary>
                <label for="rosterInput" class="visually-hidden">체크할 명단 붙여넣기</label>
                <textarea id="rosterInput" class="roster-input" rows="6" placeholder="명단을 그대로 붙여넣으세요 (한 줄에 한 명, 뒤에 붙는 카운터 숫자는 무시됩니다)"></textarea>
                <button type="button" id="btnApplyRoster" class="add-btn">이 명단으로 체크</button>
                <div id="rosterResult" class="roster-result" aria-live="polite" hidden></div>
            </details>
        </section>

        <main class="list-container">
            <ul id="memberList" class="member-list" aria-label="길드원 명단">
                <li class="loading-state">데이터를 불러오는 중입니다...</li>
            </ul>
        </main>

        <footer class="action-bar">
            <button type="button" id="btnSendKakao" class="primary-btn">
                <span>카카오톡으로 결과 공유</span>
            </button>
        </footer>
    </div>

    <script src="js/script.js" type="module"></script>
    <script src="js/chance.js" type="module"></script>
    <script src="js/render.js" type="module"></script>
</body>
</html>
